name: Publish

on:
  workflow_run:
    workflows: [Generate Baseline Profiles]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    uses: embarrasdf/devops/.github/workflows/publish.yml@main
    permissions:
      contents: write
      # The release changelog reads the merged pull requests.
      issues: read
      pull-requests: read
    with:
      runs-on: ubuntu-latest
