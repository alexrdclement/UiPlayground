name: Generate Baseline Profiles

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Firebase Test Lab
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.username != 'github-actions[bot]'
    uses: embarrasdf/devops/.github/workflows/firebase-test-lab.yml@main
    permissions:
      contents: write
    with:
      tasks: :baseline-profile:generateBaselineProfile
      artifact-name: baseline-profiles
      paths: androidApp/src/release/generated/baselineProfiles/startup-prof.txt
      commit-paths: androidApp/src/release/generated/baselineProfiles/startup-prof.txt
      commit-message: "🤖 Update baseline profiles"
      lfs: true
    secrets:
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
