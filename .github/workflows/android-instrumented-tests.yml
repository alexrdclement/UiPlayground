name: Android Instrumented Tests

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: embarrasdf/devops/.github/workflows/firebase-test-lab.yml@claude/loving-mendel-w26y87-ci-test
    permissions:
      contents: write
    with:
      name: Android Instrumented Tests
      tasks: :androidApp:runInstrumentedTests
      artifact-name: instrumented-test-results
      paths: '**/build/outputs/androidTest-results/managedDevice/**/*.xml'
      lfs: true
      timeout-minutes: 60
    secrets:
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
